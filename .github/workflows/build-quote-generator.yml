name: Warm quote generator build cache

on:
  pull_request:
    branches: [main]
    paths:
      - "quote-generator/**"
      - "docker/quote-generator/Dockerfile"
      - ".github/workflows/build-quote-generator.yml"
  push:
    branches: [main]
    paths:
      - "quote-generator/**"
      - "docker/quote-generator/Dockerfile"
      - ".github/workflows/build-quote-generator.yml"

concurrency:
  group: quote-generator-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `packages: write` is required only on push to refresh the registry-backed
# BuildKit cache. Deployment hosts still build their runtime image from source.
permissions:
  contents: read
  packages: write

env:
  QUOTE_GENERATOR_CACHE: ghcr.io/${{ github.repository_owner }}/quotation-landingpage-template-quote-generator:buildcache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache is separate from the runtime image and uses mode=max, so
      # it retains the intermediate `dependencies` stage. Therefore a clean CI
      # runner reuses `npm ci` whenever package-lock.json is unchanged.
      - name: Validate pull request source build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./quote-generator
          file: ./docker/quote-generator/Dockerfile
          push: false
          cache-from: type=registry,ref=${{ env.QUOTE_GENERATOR_CACHE }}

      - name: Build source and refresh cache
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./quote-generator
          file: ./docker/quote-generator/Dockerfile
          push: false
          cache-from: type=registry,ref=${{ env.QUOTE_GENERATOR_CACHE }}
          cache-to: type=registry,ref=${{ env.QUOTE_GENERATOR_CACHE }},mode=max,compression=zstd

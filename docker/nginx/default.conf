server {
    listen 80;
    server_name quote.capellatravel.com;

    # Allow uploads up to 20MB (15MB image + overhead)
    client_max_body_size 20M;

    # Timeouts for long-running requests (publish, upload)
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://app:8111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check bypass — no proxy overhead needed
    location /health/live {
        proxy_pass http://app:8111;
        proxy_read_timeout 5s;
    }
}

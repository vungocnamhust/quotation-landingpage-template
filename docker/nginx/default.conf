server {
    listen 80;
    server_name quote.capellatravel.com;

    # Allow uploads up to 20MB (15MB image + overhead)
    client_max_body_size 20M;

    # Timeouts for long-running requests (publish, upload)
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ^~ /internal/ { return 404; }
    location ^~ /api/internal/ { return 404; }

    # Next static chunks must be served by the same editor application as the
    # route shell. Otherwise the V1 FastAPI fallback returns HTML/404 for JS,
    # leaving the workspace permanently in its loading state after hydration.
    location ^~ /_next/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/map-tiles/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # V2 editor is a Next.js application. Cloudflare Access protects this host
    # today; DMC gateway can later replace the direct header bridge without
    # changing any browser URL.
    location ^~ /quotations/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header X-DMC-Email "";
        proxy_set_header X-DMC-Person-Id "";
        proxy_set_header X-DMC-Brand "";
        proxy_set_header X-DMC-Role "";
        proxy_set_header X-Quote-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /content-studio/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header X-DMC-Email "";
        proxy_set_header X-DMC-Person-Id "";
        proxy_set_header X-DMC-Brand "";
        proxy_set_header X-DMC-Role "";
        proxy_set_header X-Quote-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /preferences/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header X-DMC-Email "";
        proxy_set_header X-DMC-Person-Id "";
        proxy_set_header X-DMC-Brand "";
        proxy_set_header X-DMC-Role "";
        proxy_set_header X-Quote-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v2/ {
        proxy_pass http://app:8111;
        proxy_set_header X-DMC-Email "";
        proxy_set_header X-DMC-Person-Id "";
        proxy_set_header X-DMC-Brand "";
        proxy_set_header X-DMC-Role "";
        proxy_set_header X-Quote-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # Root location proxies to Next.js quote-generator, which redirects / to /workspace
    location / {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check bypass — no proxy overhead needed
    location /health/live {
        proxy_pass http://app:8111;
        proxy_read_timeout 5s;
    }
}


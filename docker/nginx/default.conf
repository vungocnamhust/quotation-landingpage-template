server {
    listen 80 default_server;
    server_name _;

    # Public brand hosts are database-driven.  Only quotation/media routes are
    # accepted here; the Next/FastAPI resolver still verifies hostname against
    # brands.status=active, so an unknown host receives 404 rather than a shell.
    location ~ ^/(en|vi|ar)/q/[^/]+/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(en|vi|ar)/q/[^/]+$ {
        proxy_pass http://quote-generator:8115;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=86400" always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/map-tiles/ {
        proxy_pass http://quote-generator:8115;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 444; }
}


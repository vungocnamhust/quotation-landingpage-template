# Section Rule & Prompt Configuration: Overview Letter

scope: "overview_letter"
title: "Overview & Personal Welcome Letter"
rules:
  - "Apply Ground Rule #1 (The 70/30 Exploration Protocol): Frame the journey around 70% structured discovery (must-see spots, top-tier dining, smooth transfers) and 30% open buffer (spontaneous detours, relaxing breaks, zero rush)."
  - "Adopt the tone of a personal, highly attentive luxury travel consultant."
  - "Follow 3-part letter structure: Opening (~40–60 words in letterIntro), Main Body (~60–100 words in letterBody2 framing 70/30 pace and signature highlights), and Gracious Closing (~30–50 words in letterOutro). Total letter copy must remain within ~150–220 words."
  - "Highlight pull-quote (letterHighlight) must be a punchy summary quote (~15–30 words, max 500 characters)."
  - "When 'request_brief.occasion' is provided, open the letter with personalized congratulations."
  - "When 'request_brief.interests' are provided, reference how the itinerary honors these specific passions."
  - "When 'request_brief.must_have' is provided, highlight that this signature experience has been seamlessly secured."
  - "When 'request_brief.avoid' is provided, reassure the guest regarding seclusion, crowd avoidance, and relaxed pacing."
output_fields:
  - "journeyOverviewTitle"
  - "letterHighlight"
  - "letterGreeting"
  - "letterIntro"
  - "letterBody2"
  - "letterOutro"
  - "letterSignOff"
  - "letterSender"

name: quotation-e2e

x-pdf-app-build: &pdf-app-build
  context: .
  dockerfile: docker/app/Dockerfile
  target: pdf-runtime

x-migration-build: &migration-build
  context: .
  dockerfile: docker/app/Dockerfile
  target: runtime-base

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: quotation
      POSTGRES_PASSWORD: quotation-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation -d quotation"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: e2e-access-key
      MINIO_ROOT_PASSWORD: e2e-secret-key
    networks: [e2e]

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set e2e http://minio:9000 e2e-access-key e2e-secret-key; do sleep 1; done; mc mb --ignore-existing e2e/quotation-v2"]
    networks: [e2e]

  migrate:
    # Explicit local tags prevent Compose from trying to pull an untagged
    # development image before it can use the targeted build cache.
    image: quotation-e2e-migrate:dev
    build: *migration-build
    environment: &v2_env
      ENVIRONMENT: e2e
      DATABASE_URL: postgresql+asyncpg://quotation:quotation-e2e@postgres:5432/quotation
      QUOTE_AUTH_REQUIRED: "false"
      QUOTE_SERVICE_TOKEN: e2e-internal-service-token
      R2_ACCESS_KEY_ID: e2e-access-key
      R2_SECRET_ACCESS_KEY: e2e-secret-key
      R2_BUCKET: quotation-v2
      R2_REGION: us-east-1
      R2_ENDPOINT: http://minio:9000
      R2_PUBLIC_BASE_URL: http://minio:9000/quotation-v2
      PUBLICATION_WORKER_POLL_SECONDS: "1"
      PUBLICATION_JOB_BACKOFF_BASE_SECONDS: "1"
      PUBLICATION_JOB_BACKOFF_MAX_SECONDS: "2"
      PUBLICATION_JOB_MAX_ATTEMPTS: "2"
      PUBLICATION_JOB_LEASE_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "-c", "alembic upgrade head && python scripts/migrate_v2_rich_content.py"]
    networks: [e2e]

  app:
    image: quotation-e2e-app:dev
    build: *pdf-app-build
    # Developer-provided test provider credentials stay outside the repository.
    # The e2e runner never receives them; only FastAPI calls the LLM provider.
    env_file:
      - .env.local
    environment:
      <<: *v2_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8111"]
    volumes:
      - .:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health/ready')"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      e2e:
        # Nginx declares the notification upstream unconditionally, while
        # this disposable quotation acceptance stack intentionally does not
        # run the separate notification service. The alias only allows nginx
        # to resolve its configuration; no notification endpoint is exercised
        # by this quotation/browser suite.
        aliases:
          - notification-service

  quote-generator:
    image: quotation-e2e-quote-generator:dev
    build:
      context: ./quote-generator
      dockerfile: ../docker/quote-generator/Dockerfile
    environment:
      QUOTATION_INTERNAL_API_URL: http://app:8111
      QUOTE_SERVICE_TOKEN: e2e-internal-service-token
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8115/').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [e2e]

  publication-worker:
    image: quotation-e2e-app:dev
    environment:
      <<: *v2_env
      QUOTE_GENERATOR_INTERNAL_URL: http://quote-generator:8115
    depends_on: [quote-generator]
    volumes:
      - .:/app:ro
    command: ["python", "-m", "services.publication_worker"]
    networks: [e2e]

  nginx:
    image: quotation-e2e-nginx:dev
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    environment:
      DMC_GATEWAY_ENABLED: "false"
    depends_on:
      app:
        condition: service_healthy
      quote-generator:
        condition: service_healthy
    networks:
      e2e:
        aliases:
          - quote.capellatravel.com
          - journeys.capellatravel.com
          - my.selvarajourneys.com
          - journeys.vietnamsafar.vn

  e2e:
    image: quotation-e2e-app:dev
    environment:
      <<: *v2_env
      E2E_EDITOR_BASE_URL: http://quote.capellatravel.com
      E2E_CAPELLA_PUBLIC_BASE_URL: http://journeys.capellatravel.com
      E2E_SELVARA_PUBLIC_BASE_URL: http://my.selvarajourneys.com
      E2E_API_BASE_URL: http://app:8111
      WORKFLOW_API_BASE: http://app:8111
      E2E_ARTIFACT_DIR: /artifacts
      # Curl full-tier SSR assertions traverse Nginx with the published Host
      # header, never the e2e container's localhost.
      WORKFLOW_DISPLAY_BASE: http://quote.capellatravel.com
      # The public host intentionally returns 404 for /internal. The runner
      # verifies internal PDF SSR through this service-only Next origin.
      WORKFLOW_INTERNAL_DISPLAY_BASE: http://quote-generator:8115
    depends_on: [nginx, publication-worker]
    command: ["python", "-m", "e2e.playwright_compose_v2"]
    profiles: ["test"]
    volumes:
      - ./e2e:/app/e2e:ro
      - ./scripts:/app/scripts:ro
      - ./artifacts/e2e:/artifacts
    networks: [e2e]

networks:
  e2e:

name: quotation-production

x-pdf-app-build: &pdf-app-build
  context: .
  dockerfile: docker/app/Dockerfile
  target: pdf-runtime

x-migration-build: &migration-build
  context: .
  dockerfile: docker/app/Dockerfile
  target: runtime-base

services:
  postgres:
    container_name: ${QUOTE_PRODUCTION_POSTGRES_CONTAINER_NAME:-quotation-production-postgres}
    image: postgres:16
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: quotation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quotation_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation -d quotation"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${QUOTE_MIGRATE_IMAGE:-quotation-migrate:local}
    build: *migration-build
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    # Routine deploys only advance and verify the Alembic schema.  Canonical
    # document conversion is an operator-approved cutover job below.
    command: ["/bin/sh", "-c", "alembic upgrade head && alembic current --check-heads"]
    restart: "no"

  v2-cutover-preflight:
    image: ${QUOTE_MIGRATE_IMAGE:-quotation-migrate:local}
    build: *migration-build
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.production_preflight"]
    profiles: ["cutover"]
    restart: "no"

  v2-rich-content-report:
    image: ${QUOTE_MIGRATE_IMAGE:-quotation-migrate:local}
    build: *migration-build
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/migrate_v2_rich_content.py"]
    profiles: ["cutover"]
    restart: "no"

  v2-rich-content-apply:
    image: ${QUOTE_MIGRATE_IMAGE:-quotation-migrate:local}
    build: *migration-build
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "python scripts/migrate_v2_rich_content.py --apply && python scripts/migrate_v2_rich_content.py"]
    profiles: ["cutover"]
    restart: "no"

  app:
    image: ${QUOTE_APP_IMAGE:-quotation-app:local}
    build: *pdf-app-build
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      - quotation_net
      - dmc-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - media_sync_data:/data/media-sync
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8111"]
    restart: unless-stopped

  quote-generator:
    image: ${QUOTE_GENERATOR_IMAGE:-quotation-generator:local}
    build:
      context: ./quote-generator
      dockerfile: ../docker/quote-generator/Dockerfile
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      QUOTATION_INTERNAL_API_URL: http://app:8111
    networks:
      - quotation_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8115/').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  publication-worker:
    image: ${QUOTE_APP_IMAGE:-quotation-app:local}
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      QUOTE_GENERATOR_INTERNAL_URL: http://quote-generator:8115
    networks:
      - quotation_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      quote-generator:
        condition: service_healthy
    command: ["python", "-m", "services.publication_worker"]
    restart: unless-stopped

  notification-migrate:
    image: ${QUOTE_NOTIFICATION_IMAGE:-quotation-notification:local}
    build:
      context: .
      dockerfile: docker/notification/Dockerfile
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://quotation:${POSTGRES_PASSWORD:-quotation_password}@postgres:5432/notification
      NOTIFICATION_DATABASE_URL_SYNC: postgresql+psycopg://quotation:${POSTGRES_PASSWORD:-quotation_password}@postgres:5432/notification
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "notification/alembic.ini", "upgrade", "head"]
    restart: "no"

  notification-service:
    image: ${QUOTE_NOTIFICATION_IMAGE:-quotation-notification:local}
    build:
      context: .
      dockerfile: docker/notification/Dockerfile
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOTIFICATION_PORT: 8116
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://quotation:${POSTGRES_PASSWORD:-quotation_password}@postgres:5432/notification
      NOTIFICATION_DATABASE_URL_SYNC: postgresql+psycopg://quotation:${POSTGRES_PASSWORD:-quotation_password}@postgres:5432/notification
    networks:
      - quotation_net
      - dmc-network
    depends_on:
      postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8116/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["uvicorn", "notification.main:app", "--host", "0.0.0.0", "--port", "8116"]
    restart: unless-stopped

  notification-worker:
    image: ${QUOTE_NOTIFICATION_IMAGE:-quotation-notification:local}
    build:
      context: .
      dockerfile: docker/notification/Dockerfile
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://quotation:${POSTGRES_PASSWORD:-quotation_password}@postgres:5432/notification
    networks:
      - quotation_net
    depends_on:
      notification-service:
        condition: service_healthy
    command: ["python", "-m", "notification.workers.delivery_worker"]
    restart: unless-stopped

  nginx:
    image: ${QUOTE_NGINX_IMAGE:-quotation-nginx:local}
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    env_file:
      - ${QUOTE_PRODUCTION_ENV_FILE:-.env.production}
    networks:
      quotation_net: {}
      dmc-network:
        aliases:
          - quotation-ingress
    depends_on:
      app:
        condition: service_healthy
      quote-generator:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  quotation_net:
  dmc-network:
    external: true
    name: ${DMC_NETWORK_NAME:-dmc-network}

volumes:
  postgres_data:
  media_sync_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: quotation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quotation_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation -d quotation"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: quotation-legacy-migrate:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: runtime-base
    env_file:
      - .env.production
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: quotation-legacy-app:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: pdf-runtime
    env_file:
      - .env.production
    networks:
      - quotation_net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_sync_data:/data/media-sync
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8111"]
    restart: unless-stopped

  nginx:
    image: quotation-legacy-nginx:latest
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    environment:
      DMC_GATEWAY_ENABLED: "false"
    networks:
      - quotation_net
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  quotation_net:

volumes:
  postgres_data:
  media_sync_data:

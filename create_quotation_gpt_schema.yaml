openapi: 3.1.0
info:
  title: Tour Quotation API
  version: 2.1.0
  description: API for creating complete travel tour quotations generated by a Custom GPT, including structured quotation data and the full raw quotation content.

servers:
  - url: https://journeys.vietnamsafar.vn
    description: Production server

paths:
  /quotations:
    post:
      operationId: createQuotation
      x-openai-isConsequential: false
      summary: Create a complete tour quotation.
      description: Receives a complete structured tour quotation generated by a GPT, plus the full raw quotation content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourQuotationCreateRequest"
            examples:
              luxuryVietnamFamilyJourney:
                summary: Luxury Vietnam family journey quotation with raw quotation
                value:
                  quotationNumber: QT-2026-0001
                  quotationType: tour
                  status: confirmed
                  publishStatus: published
                  source: custom-gpt
                  language: en
                  quotationTitle: LUXURY QUOTATION
                  tourTitle: VIETNAM SLOW NATURE, MOUNTAIN & BEACH FAMILY JOURNEY – 12D11N
                  duration:
                    days: 12
                    nights: 11
                    label: 12D11N
                  preparedFor: Qatar Family Guests
                  nationality: Qatar
                  travelDates:
                    startDate: 2026-09-26
                    endDate: 2026-10-07
                    displayText: 26 September 2026 – 07 October 2026
                  guests:
                    adults: 4
                    children: 4
                    infants: 0
                    totalGuests: 8
                    childrenAges:
                      - 4
                      - 8
                      - 10
                      - 11
                    displayText: 4 Adults + 4 Children
                  travelStyle:
                    - Private
                    - Halal-Friendly
                    - Luxury Family Journey
                    - Slow Nature, Mountain & Beach Escape
                  route:
                    - Hanoi
                    - Ninh Binh
                    - Sapa
                    - Ha Long Bay
                    - Da Nang
                    - Hoi An
                  hotelOptions:
                    - 4★ Premium
                    - 5★ Luxury
                  confirmedMainOption: 5★ Luxury
                  alternativeOptionRetained: 4★ Premium
                  programOverview:
                    heading: PROGRAM OVERVIEW
                    paragraphs:
                      - A refined Vietnam family journey created for Qatari travelers seeking a slower, more elegant way to experience the country’s natural beauty.
                      - The journey begins in Hanoi, continues to Ninh Binh and Sapa, includes an overnight cruise in Ha Long Bay, and ends with coastal relaxation in Da Nang and Hoi An.
                  itinerary:
                    - dayNumber: 1
                      date: 2026-09-26
                      title: Arrival in Hanoi | Private Welcome & Gentle First Evening
                      description:
                        - Upon arrival at Noi Bai International Airport, the family will be warmly welcomed by the local Vietnam Safar team and escorted by private vehicle to the hotel in Hanoi.
                        - The arrival day is intentionally kept light, allowing everyone to rest after the international flight and settle comfortably into the journey.
                      overnight: Hanoi
                      meals:
                        - No meals
                      destinations:
                        - Hanoi
                      activities:
                        - Private airport welcome
                        - Private hotel transfer
                        - Leisure time
                    - dayNumber: 2
                      date: 2026-09-27
                      title: Hanoi Elegant Cultural Discovery | Old Quarter, Lake Views & Train Street Experience
                      description:
                        - After breakfast, begin a relaxed introduction to Hanoi, Vietnam’s graceful capital.
                        - Visit the peaceful area around Hoan Kiem Lake, pass through French colonial streets, and explore selected corners of the Old Quarter.
                        - A highlight of the day is the Train Street coffee experience, subject to local regulations.
                      overnight: Hanoi
                      meals:
                        - Breakfast
                        - Lunch
                      destinations:
                        - Hanoi
                      activities:
                        - Hoan Kiem Lake
                        - Old Quarter
                        - Train Street coffee experience
                  pricing:
                    currency: SAR
                    pricingTitle: PRICE QUOTATION – INDICATIVE
                    basis: Indicative basis
                    totalGuests: 8
                    priceOptions:
                      - hotelCategory: 4★ Premium
                        optionName: 4-star premium option
                        pricePerPerson:
                          amount: 4850
                          currency: SAR
                          displayText: SAR 4,850 / person
                          isFromPrice: true
                        totalPrice:
                          amount: 38800
                          currency: SAR
                          displayText: SAR 38,800
                          isFromPrice: true
                        isConfirmedMainOption: false
                        isAlternativeOption: true
                      - hotelCategory: 5★ Luxury
                        optionName: Main luxury option
                        pricePerPerson:
                          amount: 5650
                          currency: SAR
                          displayText: SAR 5,650 / person
                          isFromPrice: true
                        totalPrice:
                          amount: 45200
                          currency: SAR
                          displayText: SAR 45,200
                          isFromPrice: true
                        isConfirmedMainOption: true
                        isAlternativeOption: false
                  inclusions:
                    - Private airport pick-up and drop-off
                    - Private A/C transportation throughout the itinerary
                    - Accommodation with daily breakfast
                    - Meals as mentioned in the program
                    - English-speaking local guide on sightseeing days
                    - Entrance fees for mentioned sightseeing
                    - Halal-friendly meal arrangements, seafood / vegetarian options where suitable
                  exclusions:
                    - International flights
                    - Vietnam visa and visa processing fees
                    - Travel insurance
                    - Personal expenses
                    - Tips for guide and driver
                    - Optional activities not mentioned
                    - Early check-in / late check-out
                    - Domestic flight Hanoi – Da Nang, subject to final routing
                    - Peak season, gala dinner, or compulsory hotel surcharges if applied
                  priceConditions:
                    heading: PRICE CONDITIONS
                    paragraphs:
                      - Rates are indicative and subject to reconfirmation at the time of booking.
                      - Final price may vary depending on hotel availability, resort category, cruise selection, domestic flight fare, rooming arrangement, child policy, and final travel services confirmed.
                      - Child rates may be adjusted after confirming the room setup, bed sharing, extra bed requirements, and hotel/cruise child policies.
                  notes:
                    - Public summary: Luxury private halal-friendly Vietnam family journey for 8 guests from Qatar, 12D11N, with Hanoi, Ninh Binh, Sapa, Ha Long Bay, Da Nang and Hoi An.
                    - Confirmed main option is 5★ Luxury; 4★ Premium is retained as an alternative option.
                  internalNotes:
                    - Full raw quotation is also sent in rawQuotation. If backend does not support rawQuotation, use this field as fallback storage for the complete raw quotation.
                  rawQuotation: |
                    # LUXURY QUOTATION

                    ## VIETNAM SLOW NATURE, MOUNTAIN & BEACH FAMILY JOURNEY – 12D11N

                    Prepared for: Qatar Family Guests
                    Nationality: Qatar
                    Travel Date: 26 September 2026 – 07 October 2026
                    Guests: 4 Adults + 4 Children
                    Children Ages: 4, 8, 10, 11 years old
                    Travel Style: Private | Halal-Friendly | Luxury Family Journey | Slow Nature, Mountain & Beach Escape
                    Route: Hanoi – Ninh Binh – Sapa – Ha Long Bay – Da Nang – Hoi An
                    Hotel Options: 4★ Premium & 5★ Luxury

                    Full confirmed quotation content should be inserted here exactly as finalized by the GPT, including program overview, day-by-day itinerary, pricing table, inclusions, exclusions, price conditions, and any final notes.
                  output:
                    quotationUrl: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83
                    pdfUrl: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83/pdf
      responses:
        "200":
          description: Quotation created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourQuotationCreateResponse"
              example:
                quotationId: quo_effb6b1d7c83
                status: created
                publishStatus: published
                message: Quotation created successfully.
                quotationUrl: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83
                pdfUrl: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83/pdf
        "400":
          description: Invalid quotation data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    TourQuotationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        quotationNumber:
          type: string
          description: Optional quotation number generated by GPT or server-side system.
          example: QT-2026-0001

        quotationType:
          type: string
          description: Type of quotation.
          enum:
            - tour
            - hotel
            - transport
            - package
            - other
          example: tour

        status:
          type: string
          description: Business status of the quotation.
          enum:
            - draft
            - confirmed
            - revised
            - cancelled
          example: confirmed

        publishStatus:
          type: string
          description: Publishing status of the quotation.
          enum:
            - draft
            - published
            - unpublished
          example: published

        source:
          type: string
          description: Source that generated the quotation.
          example: custom-gpt

        language:
          type: string
          description: Language code of the quotation content.
          example: en

        quotationTitle:
          type: string
          description: Main quotation heading.
          example: LUXURY QUOTATION

        tourTitle:
          type: string
          description: Full tour quotation title.
          example: VIETNAM SLOW NATURE, MOUNTAIN & BEACH FAMILY JOURNEY – 12D11N

        duration:
          $ref: "#/components/schemas/Duration"

        preparedFor:
          type: string
          description: Customer or group name for whom the quotation is prepared.
          example: Qatar Family Guests

        nationality:
          type: string
          description: Guest nationality or market.
          example: Qatar

        travelDates:
          $ref: "#/components/schemas/TravelDates"

        guests:
          $ref: "#/components/schemas/GuestComposition"

        travelStyle:
          type: array
          description: Travel style tags.
          items:
            type: string
          example:
            - Private
            - Halal-Friendly
            - Luxury Family Journey

        route:
          type: array
          description: Main route or destinations in order.
          items:
            type: string
          example:
            - Hanoi
            - Ninh Binh
            - Sapa
            - Ha Long Bay
            - Da Nang
            - Hoi An

        hotelOptions:
          type: array
          description: Hotel categories or options presented in the quotation.
          items:
            type: string
          example:
            - 4★ Premium
            - 5★ Luxury

        confirmedMainOption:
          type: string
          description: Main confirmed option.
          example: 5★ Luxury

        alternativeOptionRetained:
          type: string
          description: Alternative option retained for comparison.
          example: 4★ Premium

        customer:
          $ref: "#/components/schemas/Customer"

        seller:
          $ref: "#/components/schemas/Seller"

        programOverview:
          $ref: "#/components/schemas/TextSection"

        itinerary:
          type: array
          description: Day-by-day itinerary.
          minItems: 1
          items:
            $ref: "#/components/schemas/ItineraryDay"

        pricing:
          $ref: "#/components/schemas/TourPricing"

        inclusions:
          type: array
          description: List of included services.
          items:
            type: string

        exclusions:
          type: array
          description: List of excluded services.
          items:
            type: string

        priceConditions:
          $ref: "#/components/schemas/TextSection"

        termsAndConditions:
          $ref: "#/components/schemas/TextSection"

        cancellationPolicy:
          $ref: "#/components/schemas/TextSection"

        paymentTerms:
          type: string
          description: Payment terms, if applicable.
          example: 50% deposit, balance before arrival.

        notes:
          type: array
          description: Public notes or public summary visible to the client. Do not use this for the full raw quotation unless a shorter public summary is intended.
          items:
            type: string

        internalNotes:
          type: array
          description: Internal notes not intended for the client. If the backend does not support rawQuotation, the GPT may place the complete raw quotation here as fallback.
          items:
            type: string

        rawQuotation:
          type: string
          description: Full final quotation content exactly as confirmed by the GPT. This should include the complete markdown/text version of the quotation, including title, guest profile, program overview, itinerary, pricing, inclusions, exclusions, price conditions, links, and final notes.
          example: |
            # LUXURY QUOTATION

            ## VIETNAM SLOW NATURE, MOUNTAIN & BEACH FAMILY JOURNEY – 12D11N

            Prepared for: Qatar Family Guests
            Nationality: Qatar
            Travel Date: 26 September 2026 – 07 October 2026
            Guests: 4 Adults + 4 Children

            Full confirmed quotation content continues here.

        journeyGlance:
          $ref: "#/components/schemas/JourneyAtAGlance"

        whyWorks:
          $ref: "#/components/schemas/WhyThisJourneyWorks"

        hotelPlan:
          $ref: "#/components/schemas/SelectedHotelPlan"

        optionalEnhancements:
          type: array
          description: List of optional enhancements/upsells.
          items:
            $ref: "#/components/schemas/OptionalEnhancementItem"

        bookingTerms:
          $ref: "#/components/schemas/BookingPaymentTerms"

        finalization:
          $ref: "#/components/schemas/FinalizationSteps"

        output:
          $ref: "#/components/schemas/QuotationOutput"

      required:
        - quotationType
        - quotationTitle
        - tourTitle
        - duration
        - preparedFor
        - travelDates
        - guests
        - route
        - programOverview
        - itinerary
        - pricing
        - rawQuotation

    Duration:
      type: object
      additionalProperties: false
      properties:
        days:
          type: integer
          minimum: 1
          example: 12
        nights:
          type: integer
          minimum: 0
          example: 11
        label:
          type: string
          example: 12D11N
      required:
        - days
        - nights

    TravelDates:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
          example: 2026-09-26
        endDate:
          type: string
          format: date
          example: 2026-10-07
        displayText:
          type: string
          example: 26 September 2026 – 07 October 2026
      required:
        - startDate
        - endDate

    GuestComposition:
      type: object
      additionalProperties: false
      properties:
        adults:
          type: integer
          minimum: 0
          example: 4
        children:
          type: integer
          minimum: 0
          example: 4
        infants:
          type: integer
          minimum: 0
          example: 0
        totalGuests:
          type: integer
          minimum: 1
          example: 8
        childrenAges:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 17
          example:
            - 4
            - 8
            - 10
            - 11
        displayText:
          type: string
          example: 4 Adults + 4 Children
      required:
        - totalGuests

    Customer:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: Qatar Family Guests
        contactName:
          type: string
          example: Mr. Ahmed
        email:
          type: string
          format: email
          example: customer@example.com
        phone:
          type: string
          example: "+97412345678"
        address:
          type: string
          example: Doha, Qatar
        nationality:
          type: string
          example: Qatar
        market:
          type: string
          example: GCC
      required:
        - name

    Seller:
      type: object
      additionalProperties: false
      properties:
        companyName:
          type: string
          example: Vietnam Safar
        contactName:
          type: string
          example: Sales Team
        email:
          type: string
          format: email
          example: sales@vietnamsafar.vn
        phone:
          type: string
          example: "+84987654321"
        address:
          type: string
          example: Vietnam
        taxCode:
          type: string
          example: "0987654321"
        website:
          type: string
          format: uri
          example: https://journeys.vietnamsafar.vn
      required:
        - companyName

    TextSection:
      type: object
      additionalProperties: false
      properties:
        heading:
          type: string
          example: PROGRAM OVERVIEW
        paragraphs:
          type: array
          minItems: 1
          items:
            type: string
      required:
        - paragraphs

    ItineraryDay:
      type: object
      additionalProperties: false
      properties:
        dayNumber:
          type: integer
          minimum: 1
          example: 1
        date:
          type: string
          format: date
          example: 2026-09-26
        title:
          type: string
          example: Arrival in Hanoi | Private Welcome & Gentle First Evening
        description:
          type: array
          description: Paragraphs describing the day.
          minItems: 1
          items:
            type: string
        overnight:
          type: string
          example: Hanoi
        meals:
          type: array
          description: Meals included on this day.
          items:
            type: string
            enum:
              - Breakfast
              - Lunch
              - Dinner
              - Brunch
              - No meals
              - Other
          example:
            - Breakfast
            - Lunch
        destinations:
          type: array
          description: Destinations visited or stayed on this day.
          items:
            type: string
          example:
            - Hanoi
        activities:
          type: array
          description: Main activities or highlights.
          items:
            type: string
          example:
            - Private airport welcome
            - Hotel transfer
        optionalActivities:
          type: array
          description: Optional activities mentioned for the day.
          items:
            type: string
        notes:
          type: array
          description: Day-specific notes.
          items:
            type: string
      required:
        - dayNumber
        - title
        - description

    TourPricing:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          description: Currency code.
          example: SAR
        pricingTitle:
          type: string
          example: PRICE QUOTATION – INDICATIVE
        basis:
          type: string
          description: Pricing basis.
          example: Indicative basis
        totalGuests:
          type: integer
          minimum: 1
          example: 8
        priceOptions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceOption"
        subtotal:
          type: number
          minimum: 0
          example: 45200
        discountTotal:
          type: number
          minimum: 0
          example: 0
        taxTotal:
          type: number
          minimum: 0
          example: 0
        grandTotal:
          type: number
          minimum: 0
          example: 45200
      required:
        - currency
        - priceOptions

    PriceOption:
      type: object
      additionalProperties: false
      properties:
        hotelCategory:
          type: string
          example: 5★ Luxury
        optionName:
          type: string
          example: Main luxury option
        pricePerPerson:
          $ref: "#/components/schemas/MoneyAmount"
        totalPrice:
          $ref: "#/components/schemas/MoneyAmount"
        isConfirmedMainOption:
          type: boolean
          example: true
        isAlternativeOption:
          type: boolean
          example: false
        notes:
          type: array
          items:
            type: string
      required:
        - hotelCategory
        - pricePerPerson
        - totalPrice

    MoneyAmount:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          minimum: 0
          example: 5650
        currency:
          type: string
          example: SAR
        displayText:
          type: string
          example: SAR 5,650 / person
        isFromPrice:
          type: boolean
          description: Whether the price is shown as a starting price.
          example: true
      required:
        - amount
        - currency

    QuotationOutput:
      type: object
      additionalProperties: false
      properties:
        quotationUrl:
          type: string
          format: uri
          description: URL to preview the quotation.
          example: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83
        pdfUrl:
          type: string
          format: uri
          description: URL to download or view PDF.
          example: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83/pdf

    TourQuotationCreateResponse:
      type: object
      additionalProperties: false
      properties:
        quotationId:
          type: string
          example: quo_effb6b1d7c83
        status:
          type: string
          example: created
        publishStatus:
          type: string
          example: published
        message:
          type: string
          example: Quotation created successfully.
        quotationUrl:
          type: string
          format: uri
          example: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83
        pdfUrl:
          type: string
          format: uri
          example: https://tour-quotations.vercel.app/quotations/quo_effb6b1d7c83/pdf
      required:
        - quotationId
        - status
        - message

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          example: invalid_request
        message:
          type: string
          example: Invalid quotation data.
        details:
          type: array
          items:
            type: string
      required:
        - error
        - message

    JourneyAtAGlance:
      type: object
      additionalProperties: false
      properties:
        market:
          type: string
          example: GCC
        guestProfile:
          type: string
          example: Family
        hotelStandard:
          type: string
          example: 5★ Luxury
        mealPreference:
          type: string
          example: Halal-friendly
        priceType:
          type: string
          example: Indicative Rate
        tourCode:
          type: string
          example: VS-2026-01
        domesticFlights:
          type: string
          example: Included
        priceBasis:
          type: string
          example: Twin/double sharing
        partnerNote:
          type: string
          example: Indicative Rate
        validity:
          type: string
          example: 2026-12-31

    WhyThisJourneyWorks:
      type: object
      additionalProperties: false
      properties:
        privateFlexible:
          type: string
          example: Private vehicle and guide allow comfortable pacing.
        comfort:
          type: string
          example: Slow family pacing.
        muslimFriendly:
          type: string
          example: Halal meals and prayer timing.
        balancedHighlights:
          type: string
          example: Balanced culture, nature, and shopping.

    SelectedHotelPlan:
      type: object
      additionalProperties: false
      properties:
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/HotelPlanItem"
        roomNotes:
          type: string
          example: Connecting rooms requested.
      required:
        - hotels

    HotelPlanItem:
      type: object
      additionalProperties: false
      properties:
        destination:
          type: string
          example: Hanoi
        checkInDate:
          type: string
          format: date
          example: 2026-09-26
        checkOutDate:
          type: string
          format: date
          example: 2026-09-28
        hotelArrangement:
          type: string
          example: Sofitel Legend Metropole - 2 Nights - Luxury Room
      required:
        - destination
        - hotelArrangement

    OptionalEnhancementItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          example: Arabic-Speaking Guide
        status:
          type: string
          example: On request
      required:
        - title
        - status

    BookingPaymentTerms:
      type: object
      additionalProperties: false
      properties:
        deposit:
          type: string
          example: 30% upon confirmation
        balance:
          type: string
          example: 70% due 30 days before arrival
        cancellation:
          type: string
          example: Policy according to supplier conditions
        confirmation:
          type: string
          example: Services are secured after deposit

    FinalizationSteps:
      type: object
      additionalProperties: false
      properties:
        finalDetailsRequired:
          type: array
          items:
            type: string
          example:
            - Guest full names
            - Passport details
        afterConfirmation:
          type: array
          items:
            type: string
          example:
            - Vietnam Safar secures all hotels and services
            - Final travel documents shared before arrival